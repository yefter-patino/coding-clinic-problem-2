---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Turn on the daily update and upgrade jobs
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Set the security-only upgrade rules
  ansible.builtin.template:
    src: 52yefter-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52yefter-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Make sure the apt timers are on
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
