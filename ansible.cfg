[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
host_key_checking  = True
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
interpreter_python = auto_silent
# remote_user and private_key_file are NOT set here on purpose:
# pass them with -u / --private-key or set them in group_vars (see README).

[privilege_escalation]
become        = True
become_method = sudo

[ssh_connection]
pipelining = True
